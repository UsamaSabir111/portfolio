<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Contact Me</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>Contact Me</h1>
</header>

<nav>
    <div class="logo">Portfolio</div>

    <div class="menu-toggle" onclick="toggleMenu()">☰</div>

    <div class="nav-links" id="navLinks">
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="skills.html">Skills</a>
        <a href="projects.html">Projects</a>
        <a href="contact.html">Contact</a>
    </div>
</nav>

<section class="container">

    <form action="https://formspree.io/f/maqdrwbp" method="POST">

        <label>Name</label>
        <input type="text" name="name" required>

        <label>Email</label>
        <input type="email" name="email" required>

        <label>Service / Tool Required</label>
        <select name="tool" required>
            <option value="">-- Select Option --</option>
            <option value="HTML Website">HTML Website</option>
            <option value="Portfolio Website">Portfolio Website</option>
            <option value="Bug Fixing">Bug Fixing</option>
            <option value="Frontend Design">Frontend Design</option>
            <option value="Other">Other</option>
        </select>

        <label>Message</label>
        <textarea name="message" rows="5" required></textarea>

        <input type="hidden" name="_subject" value="New Portfolio Contact Message">
        <input type="hidden" name="_next" value="thankyou.html">

        <button type="submit">Send Message</button>

    </form>

</section>

<script>
function toggleMenu() {
    document.getElementById("navLinks").classList.toggle("active");
}
</script>

</body>
</html>
